name: Digital Wallet CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/digital_wallet
      DB_USERNAME: root
      DB_PASSWORD: IamRo@45

      JWT_SECRET: mysecretkeymysecretkeymysecretkeymysecretkeymysecretkey
      JWT_EXPIRATION_MS: 900000

      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_USERNAME: test
      MAIL_PASSWORD: test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: digital_wallet
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests and package application
        run: mvn -B clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-wallet-jar
          path: target/*.jar

  docker-build-and-push:
    name: Docker Build and Push
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-wallet:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-wallet:${{ github.sha }}
