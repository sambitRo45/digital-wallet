
name: Digital Wallet CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # JOB 1: BUILD AND TEST
  # ==========================================

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      # Database Configuration
      DB_URL: jdbc:mysql://127.0.0.1:3306/digital_wallet
      DB_USERNAME: root
      DB_PASSWORD: root

      # JWT Configuration
      JWT_SECRET: mysecretkeymysecretkeymysecretkeymysecretkeymysecretkey
      JWT_EXPIRATION_MS: 900000

      # Email Configuration (CI Testing)
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_USERNAME: test
      MAIL_PASSWORD: test
      MAIL_SMTP_AUTH: false
      MAIL_SMTP_STARTTLS: false

      # Admin Configuration
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: digital_wallet

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # Step 1: Checkout Source Code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Setup Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Validate Required Secrets
      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "$ADMIN_EMAIL" ]; then
            echo "ADMIN_EMAIL secret is missing"
            exit 1
          fi

          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "ADMIN_PASSWORD secret is missing"
            exit 1
          fi

          echo "Required admin configuration is available"

      # Step 4: Build and Run Tests
      - name: Run tests and package application
        run: mvn -B clean verify

      # Step 5: Upload JAR Artifact
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-wallet-jar
          path: target/*.jar
          if-no-files-found: error


  # ==========================================
  # JOB 2: DOCKER BUILD AND PUSH
  # ==========================================

  docker-build-and-push:
    name: Docker Build and Push

    needs: build-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout Source Code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Download JAR Artifact
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: digital-wallet-jar
          path: target/

      # Step 3: Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Build and Push Docker Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-wallet:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-wallet:${{ github.sha }}
