services:

  mysql:
    image: mysql:8.0
    container_name: digital-wallet-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: digital_wallet
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: digital-wallet-app
    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/digital_wallet
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
